[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails-protocol"
version = "0.1.0"
description = "A small, fail-closed evidence gate and prototype truth boundary for Python AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Yusuf Sen (PHI-BRAIN Systems)" }]
keywords = ["ai-agents", "guardrails", "truth-boundary", "epistemic-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
