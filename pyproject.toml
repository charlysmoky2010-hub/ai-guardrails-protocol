[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails-protocol"
version = "1.0.0"
description = "Lightweight, Fail-Closed Truth Boundary & Execution Guardrails for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Yusuf Sen (PHI-BRAIN Systems)" }]
keywords = ["ai-agents", "guardrails", "truth-boundary", "fail-closed", "epistemic-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
