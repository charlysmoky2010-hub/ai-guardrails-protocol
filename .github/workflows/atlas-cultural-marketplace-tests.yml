name: Anatolian Atlas Cultural Marketplace Tests

on:
  pull_request:
    paths:
      - "anatolian-atlas/**"
      - ".github/workflows/atlas-cultural-marketplace-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cultural-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check semantic and script syntax
        run: |
          node --check anatolian-atlas/catalog.mjs
          node --check anatolian-atlas/atlas.mjs
          node --check anatolian-atlas/atlas.test.mjs
          test -s anatolian-atlas/index.html
          test -s anatolian-atlas/atlas.css
          test -s anatolian-atlas/studio/index.html
      - name: Test real product boundary and craft exploration
        run: node --test anatolian-atlas/atlas.test.mjs
